    <style>
        :root {
            --primary-color: #800020; /* Deep Burgundy / Maroon */
            --accent-color: #D4AF37; /* Champagne Gold */
            --text-dark: #1A1A1A;
            --text-light: #666666;
            --bg-color: #FAFAFA;
            --white: #FFFFFF;
            --border: #EAEAEA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* --- TOP PROMO BAR --- */
        .top-bar {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- HEADER --- */
        header {
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-color);
            font-style: italic;
        }

        .search-container {
            flex: 0.5;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 40px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: var(--bg-color);
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            background: var(--white);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .header-icons {
            display: flex;
            gap: 25px;
            font-size: 20px;
        }

        .icon-btn {
            position: relative;
            cursor: pointer;
            transition: color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icon-btn:hover { color: var(--primary-color); }
        .icon-btn span { font-size: 10px; font-weight: 600; margin-top: 4px; text-transform: uppercase; }
        
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--accent-color);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
